[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "noise-recorder"
version = "0.1.0"
description = "All-day ambient noise recorder for macOS with a SQLite log and web dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # required by fastapi.testclient
    "ruff>=0.6",
]

[project.scripts]
noise-recorder = "noise_recorder.recorder:main"
noise-report = "noise_recorder.report:main"
noise-dashboard = "noise_recorder.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/noise_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
